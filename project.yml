# Definição do projeto para o XcodeGen.
# O arquivo .xcodeproj não fica no repositório: ele é gerado a partir daqui
# no Mac do GitHub Actions, a cada compilação. Nada exige o Xcode local.
name: Jarvis
options:
  bundleIdPrefix: com.soturnna
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jarvis:
    type: application
    platform: iOS
    # Cada fase acrescenta pastas aqui (Modules/ entra na fase 1).
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
        excludes:
          - "Scriptable/**"
      # O script do Scriptable vai dentro do app como um arquivo comum (não é compilado).
      - path: Resources/Scriptable/Jarvis.js
        buildPhase: resources
    dependencies:
      - target: JarvisWidgets
    scheme: {}
    # O App Group é PEDIDO aqui, mas quem decide se ele existe é quem assina o app.
    # O iOSGods App+ não o entrega; por isso o código o procura em tempo de execução
    # (Core/WidgetBridge/WidgetShared.swift) e o app funciona sem ele.
    entitlements:
      path: App/Jarvis.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.soturnna.jarvis
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Texto mostrado pelo iOS na primeira vez que o app pede o Face ID.
        NSFaceIDUsageDescription: O Jarvis usa o Face ID para proteger suas informações.
        # Pasta do Jarvis visível no app Arquivos: o Scriptable lê o resumo dos widgets dali.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Toque num widget abre a tela certa (jarvis://treino etc.). Só navega:
        # o app continua pedindo Face ID e nenhum dado entra por esse caminho.
        CFBundleURLTypes:
          - CFBundleURLName: com.soturnna.jarvis.widgets
            CFBundleURLSchemes:
              - jarvis
        # Segurança de rede: nenhuma exceção ao App Transport Security.
        # Sem NSAppTransportSecurity aqui, o iOS só permite conexões HTTPS.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.jarvis
        PRODUCT_NAME: Jarvis
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Jarvis.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # Extensão WidgetKit (dentro do app, em PlugIns/). Só aparece no iPhone se o App Group existir.
  # Ela compila apenas os arquivos que precisa: o contrato do arquivo e os tokens visuais.
  JarvisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JarvisWidgets
      - path: Core/WidgetBridge/WidgetShared.swift
      - path: Core/Design/Theme.swift
    entitlements:
      path: JarvisWidgets/JarvisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.soturnna.jarvis
    info:
      path: JarvisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.jarvis.widgets
        PRODUCT_NAME: JarvisWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: JarvisWidgets/JarvisWidgets.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
